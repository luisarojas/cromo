# Trivy ignore list — mirrors pnpm.auditConfig.ignoreGhsas in package.json.
# Every entry here must also be in ignoreGhsas (and vice versa); the
# auditConfig."//" comment there is the source of truth for WHY.
#
# Each entry carries an `expired_at` date so the suppression CANNOT become
# permanent: once the date passes, Trivy stops ignoring the vuln and the CI
# scan fails again, forcing a revisit. `pnpm audit`'s ignoreGhsas has no expiry,
# so THIS file is the alarm clock — keep the dates here in sync with reality.
#
# Note: the CI step also runs with `ignore-unfixed: true`, so Trivy already
# skips advisories with no patched release. Entries are still listed here so
# the expiry forces a re-check even if Trivy's DB later records a fix.
#
# braces stack-exhaustion DoS (GHSA-vfj7-8cjw-p6xm / CVE-2026-93687, high).
# No patched release exists — braces 3.0.3 is the latest and is vulnerable.
# Only reachable via frontend dev/build-time tooling on developer-authored globs
# (eslint-config-next → @next/eslint-plugin-next → fast-glob → micromatch, and
# tailwindcss@3 → chokidar/fast-glob) — never a production request path.
# eslint-config-next@16 still pulls it, so no upgrade clears it.
#
# Revisit trigger (what to check when this expires):
#   - Has braces shipped a release > 3.0.3?  pnpm view braces version
#   If yes: refresh the lockfile (pnpm update braces -r --depth Infinity), then
#   remove this entry AND GHSA-vfj7-8cjw-p6xm from ignoreGhsas. Otherwise bump
#   the dates.
vulnerabilities:
  - id: CVE-2026-93687
    statement: "braces stack-exhaustion DoS (GHSA-vfj7-8cjw-p6xm); no upstream fix, dev/build-time only — see header."
    expired_at: 2026-11-05
  - id: GHSA-vfj7-8cjw-p6xm
    statement: "braces stack-exhaustion DoS; no upstream fix, dev/build-time only — see header."
    expired_at: 2026-11-05
