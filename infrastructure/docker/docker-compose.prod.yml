# Production docker-compose, applied on the EC2 host (Phase B1 EC2 + Docker
# Compose architecture — see ADR-0001). All persistent state lives in managed
# AWS services (RDS, ElastiCache, S3, SES); the host stays stateless.
#
# Image tags are injected by the deploy pipeline:
#   IMAGE_TAG=<git-sha> ECR_REGISTRY=<account>.dkr.ecr.ca-central-1.amazonaws.com
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Secrets and per-environment config come from /etc/cromo/cromo.env on the
# host, which is rendered from AWS Secrets Manager by the user-data script.

services:

  # Self-hosted Redis for environments without managed ElastiCache (e.g. dev,
  # to save ~$12/mo). Only starts when the `local-redis` compose profile is
  # active — the user-data script exports COMPOSE_PROFILES=local-redis for
  # non-prod. Prod leaves the profile unset and points REDIS_URL at its
  # managed multi-AZ ElastiCache, so this container never runs there. State is
  # cache + ephemeral queue/live-room data only; persistence is disabled, so a
  # container/instance recycle just cold-starts an empty cache.
  redis:
    image: redis:7-alpine
    profiles: ["local-redis"]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # No host port publishing — the api container reaches Redis over the
    # compose network as `redis:6379`. Not exposed to the host/internet.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    image: ${ECR_REGISTRY}/cromo-backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - /etc/cromo/cromo.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      JOBS_MODE: enabled
    ports:
      - "3001:3001"
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.5"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: ca-central-1
        awslogs-group: /cromo/${CROMO_ENV}/api
        awslogs-create-group: "true"

  frontend:
    image: ${ECR_REGISTRY}/cromo-frontend:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - /etc/cromo/cromo.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: ca-central-1
        awslogs-group: /cromo/${CROMO_ENV}/frontend
        awslogs-create-group: "true"
