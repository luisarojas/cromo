services:

  # ─── PostgreSQL Database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cromo
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: cromo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cromo -d cromo_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    cpus: 1.0

  # ─── Redis Cache ───────────────────────────────────────────
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    # maxmemory caps Redis at half the container's memory so an eviction
    # storm can't OOM-kill the container before Redis itself evicts.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    cpus: 0.5

  # ─── Backend API ───────────────────────────────────────────
  api:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile.local
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: ../../.env.local
        required: false
    environment:
      # These override .env.local with docker-internal values where hostnames differ
      NODE_ENV: development
      DATABASE_URL: postgres://cromo:localpassword@db:5432/cromo_dev
      REDIS_URL: redis://cache:6379
      SMTP_HOST: mailpit
      FRONTEND_URL: http://localhost:3000
      PORT: "3001"
    volumes:
      - ../../apps/backend/src:/app/apps/backend/src
      - ../../packages/shared/src:/app/packages/shared/src
      - local_uploads:/app/uploads
      # Manifests bind-mounted so the host is the source of truth: dep changes
      # are visible inside the container without rebuilding the image.
      - ../../package.json:/app/package.json
      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ../../apps/backend/package.json:/app/apps/backend/package.json
      - ../../packages/shared/package.json:/app/packages/shared/package.json
      # node_modules in named volumes: seeded from the image, then reconciled by
      # the startup `pnpm install`. Keeps installed deps off the host bind mounts.
      - api_root_node_modules:/app/node_modules
      - api_backend_node_modules:/app/apps/backend/node_modules
      - api_shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # node is guaranteed to be on PATH in the image; using it instead of
    # curl/wget avoids forcing the image to ship a separate HTTP client.
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      # Generous window: the first boot after a dependency change spends extra
      # time in `pnpm install` before the server starts listening.
      start_period: 90s
    mem_limit: 768m
    cpus: 1.5

  # ─── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ../../
      dockerfile: apps/frontend/Dockerfile.local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_ENV: development
    volumes:
      - ../../apps/frontend/src:/app/apps/frontend/src
      - ../../apps/frontend/messages:/app/apps/frontend/messages
      - ../../packages/shared/src:/app/packages/shared/src
      # Manifests bind-mounted so the host is the source of truth: dep changes
      # are visible inside the container without rebuilding the image.
      - ../../package.json:/app/package.json
      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ../../apps/frontend/package.json:/app/apps/frontend/package.json
      - ../../packages/shared/package.json:/app/packages/shared/package.json
      # node_modules in named volumes: seeded from the image, then reconciled by
      # the startup `pnpm install`. Keeps installed deps off the host bind mounts.
      - fe_root_node_modules:/app/node_modules
      - fe_frontend_node_modules:/app/apps/frontend/node_modules
      - fe_shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.5

  # ─── Mailpit (local email catcher) ─────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # ─── Redis Commander (cache browser) ───────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:cache:6379
    ports:
      - "8081:8081"
    depends_on:
      - cache

  # ─── pgAdmin (database browser) ────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - db

volumes:
  postgres_data:
  local_uploads:
  api_root_node_modules:
  api_backend_node_modules:
  api_shared_node_modules:
  fe_root_node_modules:
  fe_frontend_node_modules:
  fe_shared_node_modules:
