services:

  # ─── PostgreSQL Database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stickfolio
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: stickfolio_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stickfolio"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis Cache ───────────────────────────────────────────
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────
  api:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://stickfolio:localpassword@db:5432/stickfolio_dev
      REDIS_URL: redis://cache:6379
      JWT_SECRET: local-dev-secret-not-for-production
      AUTH_MODE: local
      CLAUDE_API_KEY: mock
      CLAUDE_API_MODE: mock
      S3_MODE: local
      EMAIL_PROVIDER: mailpit
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: noreply@stickfolio.local
      FRONTEND_URL: http://localhost:3000
      PORT: "3001"
    volumes:
      - ../../apps/backend/src:/app/apps/backend/src
      - ../../packages/shared/src:/app/packages/shared/src
      - local_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # ─── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ../../
      dockerfile: apps/frontend/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_ENV: development
    volumes:
      - ../../apps/frontend/src:/app/apps/frontend/src
      - ../../packages/shared/src:/app/packages/shared/src
    depends_on:
      - api

  # ─── Mailpit (local email catcher) ─────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # ─── Redis Commander (cache browser) ───────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:cache:6379
    ports:
      - "8081:8081"
    depends_on:
      - cache

  # ─── pgAdmin (database browser) ────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - db

volumes:
  postgres_data:
  local_uploads:
