version: 2

# Security updates are intentionally NOT grouped — each advisory opens its
# own PR so we can merge low-risk bumps (patch/minor) independently from
# major bumps that need code review.
#
# Non-security version updates are grouped per ecosystem to keep weekly
# PR volume manageable.

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/backend"
      - "/apps/frontend"
      - "/packages/shared"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
