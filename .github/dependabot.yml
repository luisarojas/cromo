version: 2

# Two flows are in play here, and they behave differently:
#
#   • Security updates  → opened whenever a CVE affects an in-use version.
#                         Bypass `ignore` and `open-pull-requests-limit`.
#                         Each advisory gets its own PR (no grouping below
#                         applies — they all use `applies-to: version-updates`).
#
#   • Version updates   → opened on the weekly schedule whenever a newer
#                         version exists. Major bumps are ignored below to
#                         keep PR volume sane; minor/patch are batched into
#                         one prod and one dev PR per ecosystem.
#
# Net effect: ~2 routine PRs/week, plus any security PRs (including major
# bumps that are the only safe fix — those still come through).

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/backend"
      - "/apps/frontend"
      - "/packages/shared"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
