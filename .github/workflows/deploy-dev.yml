# Build images, push to ECR, then trigger a rolling redeploy on the EC2
# instance via SSM run-command. Runs on every push to main once CI passes.
#
# Required GitHub secrets:
#   AWS_DEPLOY_ROLE_ARN — IAM role to assume via OIDC (no static credentials)
#   ECR_REGISTRY        — e.g. 123456789012.dkr.ecr.ca-central-1.amazonaws.com
#   DEV_ASG_NAME        — autoscaling group from terraform output (cromo-dev-app)
#   DEV_S3_BUCKET       — uploads bucket; the compose file is uploaded here
#                         under _deploy/ so user-data picks it up

name: Deploy to dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write   # required to assume an AWS role via OIDC
  contents: read

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    environment: dev

    env:
      AWS_REGION: ca-central-1
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile.cloud
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/cromo-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.ECR_REGISTRY }}/cromo-backend:dev-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile.cloud
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/cromo-frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.ECR_REGISTRY }}/cromo-frontend:dev-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://dev.cromotrade.ca
            NEXT_PUBLIC_ENV=dev

      - name: Upload docker-compose.prod.yml to S3
        run: |
          aws s3 cp infrastructure/docker/docker-compose.prod.yml \
            "s3://${{ secrets.DEV_S3_BUCKET }}/_deploy/docker-compose.prod.yml"

      - name: Trigger rolling redeploy via SSM
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ secrets.DEV_ASG_NAME }}" \
            --query "AutoScalingGroups[0].Instances[].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_IDS" ]; then
            echo "No instances in ASG ${{ secrets.DEV_ASG_NAME }}" >&2
            exit 1
          fi
          aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ env.IMAGE_TAG }}" \
            --parameters "commands=[
              \"set -euxo pipefail\",
              \"export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}\",
              \"export IMAGE_TAG=${{ env.IMAGE_TAG }}\",
              \"export CROMO_ENV=dev\",
              \"cd /opt/cromo\",
              \"aws s3 cp s3://${{ secrets.DEV_S3_BUCKET }}/_deploy/docker-compose.prod.yml docker-compose.yml\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}\",
              \"docker compose pull\",
              \"docker compose up -d\",
              \"docker image prune -af\"
            ]"
