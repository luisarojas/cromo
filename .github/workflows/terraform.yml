# Terraform plan/apply via GitHub Actions OIDC.
#
# Replaces the local-laptop `aws-mfa-session.sh → terraform apply` flow with
# CI-driven applies. Each Terraform stack (shared / dev / prod) maps to a
# GitHub Environment whose name encodes the AWS scope:
#
#   tf-shared → env/shared  (account-level: hosted zone, SES, IAM)
#   tf-dev    → env/dev     (the dev application stack)
#   tf-prod   → env/prod    (the prod application stack — protected)
#
# Protections:
#   - tf-shared and tf-dev auto-apply on push to `main`.
#   - tf-prod is gated on git tags, not on a GitHub Environment Required
#     Reviewer protection rule (which isn't available on the GitHub Free
#     plan for private repos). The human gate is `scripts/release.sh
#     X.Y.Z && git push origin main --tags` — the tag push is what
#     triggers a prod apply. Same security property as a UI approval,
#     plus an immutable git tag tied to every prod deploy.
#
#   The OIDC trust on the cromo-tf-runner role tightens this in IAM: the
#   tf-prod sub-claim pattern includes `ref:refs/tags/v*`, so even a
#   workflow bug or hand-edited dispatch can't apply prod without an
#   underlying v-prefix tag.
#
# Required GitHub config — see the inventory in CLAUDE.md / the chat history
# for exact values, but at minimum:
#   Repo-level secrets: AWS_TF_RUNNER_ROLE_ARN
#   Repo-level vars:    AWS_REGION
#   Per-env vars/secrets feed TF_VAR_* into the stack's variables.tf. The
#   list below is set across all three jobs because Terraform ignores
#   TF_VAR_<name> for variables that don't exist in the loaded stack.

name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    # `tags` and `branches` are OR'd. A push to main fires the workflow
    # AND a tag push fires it. Tag pushes are what trigger prod applies.
    branches: [main]
    tags: ['v*']
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      stack:
        description: 'Which stack to apply'
        required: true
        type: choice
        options: [shared, dev, prod]

concurrency:
  # Serialise per-stack so two PRs touching the same state can't race.
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write    # required to mint the OIDC token AWS verifies
  contents: read
  pull-requests: write  # for posting plan comments

jobs:
  # ─── Plan on every PR ───────────────────────────────────────────────────
  # Comments the diff for each stack so the reviewer can see what would
  # change. Runs against shared/dev/prod in parallel; failure on one
  # doesn't block the others.
  plan:
    if: github.event_name == 'pull_request'
    name: Plan ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [shared, dev, prod]
    environment: tf-${{ matrix.stack }}
    # TF_VAR_* env vars feed values into root-module variables that don't
    # have defaults (and shouldn't — they're real config). Terraform ignores
    # TF_VAR_<name> for variables that don't exist in the current stack, so
    # one block covers all three matrix legs. Sources:
    #   secrets: sensitive material (JWT signing key, AWS role ARN)
    #   vars:    non-sensitive config (emails, public DKIM key, region)
    env:
      # Non-sensitive (vars):
      # Shared stack:
      TF_VAR_dmarc_report_email:        ${{ vars.DMARC_REPORT_EMAIL }}
      TF_VAR_namecheap_dkim_public_key: ${{ vars.NAMECHEAP_DKIM_PUBLIC_KEY }}
      TF_VAR_enable_namecheap_mail:     ${{ vars.ENABLE_NAMECHEAP_MAIL }}
      TF_VAR_namecheap_dkim_selector:   ${{ vars.NAMECHEAP_DKIM_SELECTOR }}
      # Dev + prod stacks:
      TF_VAR_alert_email:               ${{ vars.ALERT_EMAIL }}
      TF_VAR_scan_provider:             ${{ vars.SCAN_PROVIDER }}
      TF_VAR_admin_emails:              ${{ vars.ADMIN_EMAILS }}
      # Dev stack only:
      TF_VAR_developer_iam_users:       ${{ vars.DEVELOPER_IAM_USERS }}
      # Sensitive (secrets):
      TF_VAR_jwt_secret:                ${{ secrets.JWT_SECRET }}
      TF_VAR_gemini_api_key:            ${{ secrets.GEMINI_API_KEY }}
      TF_VAR_groq_api_key:              ${{ secrets.GROQ_API_KEY }}
      TF_VAR_wc_api_key:                ${{ secrets.WC_API_KEY }}
      TF_VAR_admin_temp_password:       ${{ secrets.ADMIN_TEMP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.4
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-plan-${{ matrix.stack }}-${{ github.run_id }}

      - name: terraform init
        working-directory: infrastructure/terraform/env/${{ matrix.stack }}
        run: terraform init -input=false

      - name: terraform plan
        id: plan
        working-directory: infrastructure/terraform/env/${{ matrix.stack }}
        run: |
          set +e
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
          exit_code=${PIPESTATUS[0]}
          # Trim to last 60kB so we don't bust GitHub's comment size limit.
          tail -c 60000 plan.txt > plan-trimmed.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: comment plan on PR
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const plan = fs.readFileSync(
                'infrastructure/terraform/env/${{ matrix.stack }}/plan-trimmed.txt',
                'utf8'
              );
              const status = '${{ steps.plan.outputs.exit_code }}' === '0' ? 'ok' : 'failed';
              body = [
                `### Terraform plan — \`env/${{ matrix.stack }}\` (${status})`,
                '<details><summary>Plan output</summary>',
                '',
                '```',
                plan,
                '```',
                '</details>',
              ].join('\n');
            } catch (e) {
              body = `### Terraform plan — \`env/${{ matrix.stack }}\` failed before plan output was captured.`;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ─── Apply on push to main ──────────────────────────────────────────────
  # Order: shared → dev → prod. Prod requires reviewer approval via the
  # tf-prod environment protection rule (configured in GitHub UI).
  apply-shared:
    # Apply on push to main, but NOT on a tag push (tags are the prod
    # gate; shared changes go through a normal main merge).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.stack == 'shared')
    name: Apply shared
    runs-on: ubuntu-latest
    environment: tf-shared
    # See the plan job for why this env block covers all three stacks.
    env:
      # Non-sensitive (vars):
      # Shared stack:
      TF_VAR_dmarc_report_email:        ${{ vars.DMARC_REPORT_EMAIL }}
      TF_VAR_namecheap_dkim_public_key: ${{ vars.NAMECHEAP_DKIM_PUBLIC_KEY }}
      TF_VAR_enable_namecheap_mail:     ${{ vars.ENABLE_NAMECHEAP_MAIL }}
      TF_VAR_namecheap_dkim_selector:   ${{ vars.NAMECHEAP_DKIM_SELECTOR }}
      # Dev + prod stacks:
      TF_VAR_alert_email:               ${{ vars.ALERT_EMAIL }}
      TF_VAR_scan_provider:             ${{ vars.SCAN_PROVIDER }}
      TF_VAR_admin_emails:              ${{ vars.ADMIN_EMAILS }}
      # Dev stack only:
      TF_VAR_developer_iam_users:       ${{ vars.DEVELOPER_IAM_USERS }}
      # Sensitive (secrets):
      TF_VAR_jwt_secret:                ${{ secrets.JWT_SECRET }}
      TF_VAR_gemini_api_key:            ${{ secrets.GEMINI_API_KEY }}
      TF_VAR_groq_api_key:              ${{ secrets.GROQ_API_KEY }}
      TF_VAR_wc_api_key:                ${{ secrets.WC_API_KEY }}
      TF_VAR_admin_temp_password:       ${{ secrets.ADMIN_TEMP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-apply-shared-${{ github.run_id }}
      - working-directory: infrastructure/terraform/env/shared
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

  apply-dev:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.stack == 'dev')
    name: Apply dev
    needs: [apply-shared]
    runs-on: ubuntu-latest
    environment: tf-dev
    env:
      # Non-sensitive (vars):
      # Shared stack:
      TF_VAR_dmarc_report_email:        ${{ vars.DMARC_REPORT_EMAIL }}
      TF_VAR_namecheap_dkim_public_key: ${{ vars.NAMECHEAP_DKIM_PUBLIC_KEY }}
      TF_VAR_enable_namecheap_mail:     ${{ vars.ENABLE_NAMECHEAP_MAIL }}
      TF_VAR_namecheap_dkim_selector:   ${{ vars.NAMECHEAP_DKIM_SELECTOR }}
      # Dev + prod stacks:
      TF_VAR_alert_email:               ${{ vars.ALERT_EMAIL }}
      TF_VAR_scan_provider:             ${{ vars.SCAN_PROVIDER }}
      TF_VAR_admin_emails:              ${{ vars.ADMIN_EMAILS }}
      # Dev stack only:
      TF_VAR_developer_iam_users:       ${{ vars.DEVELOPER_IAM_USERS }}
      # Sensitive (secrets):
      TF_VAR_jwt_secret:                ${{ secrets.JWT_SECRET }}
      TF_VAR_gemini_api_key:            ${{ secrets.GEMINI_API_KEY }}
      TF_VAR_groq_api_key:              ${{ secrets.GROQ_API_KEY }}
      TF_VAR_wc_api_key:                ${{ secrets.WC_API_KEY }}
      TF_VAR_admin_temp_password:       ${{ secrets.ADMIN_TEMP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-apply-dev-${{ github.run_id }}
      - working-directory: infrastructure/terraform/env/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

  apply-prod:
    # Prod applies ONLY on a v* tag push. The act of cutting a release
    # (`scripts/release.sh X.Y.Z && git push origin main --tags`) is the
    # human gate — release.sh enforces clean tree + valid semver + unique
    # tag, and the OIDC trust policy on cromo-tf-runner only accepts a
    # `ref:refs/tags/v*` sub-claim for prod, so even a forced
    # workflow_dispatch without a tag won't be allowed by STS.
    #
    # Intentionally NO `environment:` — declaring one makes GitHub issue an
    # `environment:tf-prod` subject that DROPS the ref, which can't match the
    # ref-gated trust pattern (that's what broke the first prod apply). With
    # no environment, the subject is `repo:luisarojas/cromo:ref:refs/tags/vX`,
    # which the trust pattern matches and which enforces the tag gate. The
    # repo secrets below are repo-level, so no environment is needed for them.
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.stack == 'prod')
    name: Apply prod
    # Doesn't depend on apply-shared because shared only applies on a main
    # push, while prod only applies on a tag push — they never run in the
    # same workflow run.
    runs-on: ubuntu-latest
    env:
      # Non-sensitive (vars):
      # Shared stack:
      TF_VAR_dmarc_report_email:        ${{ vars.DMARC_REPORT_EMAIL }}
      TF_VAR_namecheap_dkim_public_key: ${{ vars.NAMECHEAP_DKIM_PUBLIC_KEY }}
      TF_VAR_enable_namecheap_mail:     ${{ vars.ENABLE_NAMECHEAP_MAIL }}
      TF_VAR_namecheap_dkim_selector:   ${{ vars.NAMECHEAP_DKIM_SELECTOR }}
      # Dev + prod stacks:
      TF_VAR_alert_email:               ${{ vars.ALERT_EMAIL }}
      TF_VAR_scan_provider:             ${{ vars.SCAN_PROVIDER }}
      TF_VAR_admin_emails:              ${{ vars.ADMIN_EMAILS }}
      # Dev stack only:
      TF_VAR_developer_iam_users:       ${{ vars.DEVELOPER_IAM_USERS }}
      # Sensitive (secrets):
      TF_VAR_jwt_secret:                ${{ secrets.JWT_SECRET }}
      TF_VAR_gemini_api_key:            ${{ secrets.GEMINI_API_KEY }}
      TF_VAR_groq_api_key:              ${{ secrets.GROQ_API_KEY }}
      TF_VAR_wc_api_key:                ${{ secrets.WC_API_KEY }}
      TF_VAR_admin_temp_password:       ${{ secrets.ADMIN_TEMP_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-apply-prod-${{ github.run_id }}
      - working-directory: infrastructure/terraform/env/prod
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
