# CI + deploy pipeline.
#
# On pull requests:  lint → typecheck → test → build images (no push, smoke-test only)
# On push to main:   lint → typecheck → test → build & push to ECR → deploy to dev
#
# Required GitHub config (dev environment):
#   secrets.AWS_DEPLOY_ROLE_ARN — IAM role assumed via OIDC (sensitive)
#   vars.ECR_REGISTRY           — e.g. 123456789012.dkr.ecr.ca-central-1.amazonaws.com
#   vars.DEV_ASG_NAME           — ASG name from terraform output (cromo-dev-app)
#   vars.DEV_S3_BUCKET          — uploads bucket; docker-compose is uploaded under _deploy/

name: CI + Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Nightly run at 07:00 UTC (03:00 ET / 00:00 PT). Catches drift the
  # PR/push triggers miss: flaky integration tests under fresh service
  # containers, coverage thresholds becoming stale as code rots elsewhere,
  # dependency-driven security regressions surfaced by the audit step, and
  # the Playwright suite picking up changes upstream of the workflow (e.g.
  # a backend route rename that broke a selector). Runs lint/typecheck/test,
  # security, and e2e — never builds or deploys (no images pushed, ASG
  # untouched).
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect non-doc changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'

  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cromo
          POSTGRES_PASSWORD: localpassword
          POSTGRES_DB: cromo_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cromo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cromo:localpassword@localhost:5432/cromo_dev
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      AUTH_MODE: local
      JWT_SECRET: ci-test-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply Drizzle migrations
        run: pnpm --filter @cromo/backend db:migrate

      - name: Seed catalog
        run: ./scripts/seed-database.sh --remote

      - name: Unit + integration tests (with coverage thresholds)
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/backend/coverage/
            apps/frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E — Playwright smoke
    needs: [test, changes]
    runs-on: ubuntu-latest
    # Non-gating until the suite has been observed green at least once.
    # Removes the failure-on-first-run risk for selectors / DOM assumptions
    # that were never exercised in CI (the specs predate the workflow).
    # Promote to a gating check by removing continue-on-error after the
    # first stable run — then downstream jobs will actually block on a red.
    continue-on-error: true
    if: needs.changes.outputs.code == 'true'

    # No service: containers — we bring up postgres + redis via the
    # docker-compose.e2e.yml stack alongside the api + frontend images so
    # the whole e2e topology matches what ships to dev/prod. The api and
    # frontend images are built from Dockerfile.cloud in earlier steps,
    # then docker compose consumes them by tag.

    env:
      # Host-side connection strings — db port is published to localhost by
      # the compose stack so the runner's psql can seed and flip flags
      # without exec'ing into a container.
      DATABASE_URL: postgres://cromo:localpassword@localhost:5432/cromo_dev
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v6
        with:
          # `git describe` needs full history + tags to compute APP_VERSION
          # the same way the build/deploy jobs do.
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (host — for Playwright + psql client)
        # The runner needs the workspace installed so `playwright install`
        # and `playwright test` resolve. Postgres ships psql on ubuntu-latest
        # by default; no extra install needed.
        run: pnpm install --frozen-lockfile

      - name: Compute APP_VERSION
        id: version
        run: echo "value=$(./scripts/app-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (Dockerfile.cloud, gha cache)
        # Shares the `backend` gha cache scope with the `build` and
        # `deploy-dev` jobs — they'll all hit each other's layers. Tagged
        # locally so docker-compose.e2e.yml's `image: cromo-backend:e2e`
        # resolves without a registry push.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile.cloud
          push: false
          load: true
          tags: cromo-backend:e2e
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}

      - name: Build frontend image (Dockerfile.cloud, gha cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile.cloud
          push: false
          load: true
          tags: cromo-frontend:e2e
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
            NEXT_PUBLIC_ENV=ci
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.value }}

      - name: Start postgres + redis
        # Bring infra up first so the api can connect on its first boot —
        # the backend startup chain runs drizzle migrations and then the
        # catalog seed against an empty schema, leaving the e2e stack with
        # a fully populated dev catalog by the time `Wait for api ready`
        # returns.
        run: docker compose -f infrastructure/docker/docker-compose.e2e.yml up -d db cache

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=localpassword psql -h localhost -U cromo -d cromo_dev -c '\q' 2>/dev/null; then
              echo "postgres up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::postgres failed to come up"
          exit 1

      - name: Start api (applies migrations + catalog seed on boot)
        # The backend image runs `runMigrations()` and then `runCatalogSeed()`
        # in its startup chain (apps/backend/src/plugins/database.ts), so by
        # the time the health probe passes the schema AND the catalog/test-
        # fixture seeds are in place. No separate seed step needed.
        run: docker compose -f infrastructure/docker/docker-compose.e2e.yml up -d api

      - name: Wait for api ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/v1/health/ready >/dev/null 2>&1; then
              echo "api ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::api failed to become ready"
          docker compose -f infrastructure/docker/docker-compose.e2e.yml logs api | tail -100
          exit 1

      - name: Enable scan feature flag
        # The seed already sets FEATURE_AI_SCANNING = true, but assert it
        # explicitly so a future seed change doesn't silently disable this
        # job.
        run: |
          PGPASSWORD=localpassword psql -h localhost -U cromo -d cromo_dev \
            -c "UPDATE feature_flags SET enabled = true WHERE key = 'FEATURE_AI_SCANNING'"

      - name: Start frontend
        run: docker compose -f infrastructure/docker/docker-compose.e2e.yml up -d frontend

      - name: Wait for frontend ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo "000")
            if echo "$code" | grep -qE '^(200|3[0-9]{2})$'; then
              echo "frontend ready after ${i}s (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::frontend failed to become ready"
          docker compose -f infrastructure/docker/docker-compose.e2e.yml logs frontend | tail -100
          exit 1

      - name: Install Playwright chromium
        # Skip Firefox/WebKit — the smoke test only runs in chromium per
        # playwright.config.ts. --with-deps installs the system libs the
        # browser needs.
        run: pnpm --filter @cromo/frontend exec playwright install --with-deps chromium

      - name: Run all Playwright specs
        # Runs the full apps/frontend/tests/e2e/*.spec.ts set. workers: 1
        # in playwright.config.ts keeps them serial, and the per-spec
        # retries: 2 on CI absorbs flakes.
        run: pnpm --filter @cromo/frontend exec playwright test

      - name: Capture container logs
        if: always()
        run: |
          docker compose -f infrastructure/docker/docker-compose.e2e.yml logs api      > /tmp/backend.log  2>&1 || true
          docker compose -f infrastructure/docker/docker-compose.e2e.yml logs frontend > /tmp/frontend.log 2>&1 || true
          docker compose -f infrastructure/docker/docker-compose.e2e.yml logs db       > /tmp/db.log       2>&1 || true

      - name: Upload Playwright report
        # Uploaded unconditionally so the report is available for inspection
        # even when continue-on-error masks a red.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
            /tmp/db.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down compose stack
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.e2e.yml down -v

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gitleaks needs full history to scan past commits

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (npm CVEs)
        run: pnpm audit --audit-level=high

      - name: Trivy filesystem scan (deps + Dockerfile misconfig + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: node_modules

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dev:
    name: Build, push, deploy to dev
    needs: [test, e2e, security, changes]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    environment: dev

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ca-central-1
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # fetch-depth: 0 + fetch-tags so `git describe` sees the full tag history.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute APP_VERSION
        id: version
        run: echo "value=$(./scripts/app-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile.cloud
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/cromo-backend:${{ env.IMAGE_TAG }}
            ${{ vars.ECR_REGISTRY }}/cromo-backend:dev-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile.cloud
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/cromo-frontend:${{ env.IMAGE_TAG }}
            ${{ vars.ECR_REGISTRY }}/cromo-frontend:dev-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://dev.cromotrade.ca
            NEXT_PUBLIC_ENV=dev
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.value }}

      - name: Upload docker-compose.prod.yml to S3
        run: |
          aws s3 cp infrastructure/docker/docker-compose.prod.yml \
            "s3://${{ vars.DEV_S3_BUCKET }}/_deploy/docker-compose.prod.yml"

      - name: Trigger rolling redeploy via SSM
        run: |
          # If the business-hours schedule scaled the ASG to 0, bring it up
          # for the deploy. The schedule will scale it back down at the next
          # stop time automatically.
          CURRENT=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ vars.DEV_ASG_NAME }}" \
            --query "AutoScalingGroups[0].DesiredCapacity" \
            --output text)
          if [ "$CURRENT" = "0" ]; then
            echo "ASG is at 0 — scaling up to 1 for deploy..."
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "${{ vars.DEV_ASG_NAME }}" \
              --min-size 1 --max-size 1 --desired-capacity 1
          fi

          # Wait up to 5 min for an InService instance.
          echo "Waiting for an InService instance..."
          INSTANCE_IDS=""
          for i in $(seq 1 30); do
            INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "${{ vars.DEV_ASG_NAME }}" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
              --output text)
            [ -n "$INSTANCE_IDS" ] && break
            echo "  attempt $i/30 — no InService instance yet, retrying in 10s..."
            sleep 10
          done

          if [ -z "$INSTANCE_IDS" ]; then
            echo "Timed out waiting for InService instance in ${{ vars.DEV_ASG_NAME }}" >&2
            exit 1
          fi

          # Wait up to 3 min for the SSM agent to register on the instance.
          # EC2 health checks pass before the SSM agent connects, so there is
          # a gap between InService and SendCommand being accepted.
          echo "Waiting for SSM agent to register on $INSTANCE_IDS..."
          for i in $(seq 1 18); do
            ONLINE=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_IDS" \
              --query "length(InstanceInformationList)" \
              --output text 2>/dev/null || echo "0")
            [ "$ONLINE" != "0" ] && break
            echo "  attempt $i/18 — SSM not registered yet, retrying in 10s..."
            sleep 10
          done

          aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ env.IMAGE_TAG }}" \
            --parameters "commands=[
              \"set -euxo pipefail\",
              \"export ECR_REGISTRY=${{ vars.ECR_REGISTRY }}\",
              \"export IMAGE_TAG=${{ env.IMAGE_TAG }}\",
              \"export CROMO_ENV=dev\",
              \"cd /opt/cromo\",
              \"aws s3 cp s3://${{ vars.DEV_S3_BUCKET }}/_deploy/docker-compose.prod.yml docker-compose.yml\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}\",
              \"docker compose pull\",
              \"docker compose up -d\",
              \"docker image prune -af\"
            ]"
