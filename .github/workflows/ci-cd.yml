# CI + deploy pipeline.
#
# On pull requests:  lint → typecheck → test → build images (no push, smoke-test only)
# On push to main:   lint → typecheck → test → build & push to ECR → deploy to dev
#
# Required GitHub secrets (dev environment):
#   AWS_DEPLOY_ROLE_ARN — IAM role assumed via OIDC
#   ECR_REGISTRY        — e.g. 123456789012.dkr.ecr.ca-central-1.amazonaws.com
#   DEV_ASG_NAME        — ASG name from terraform output (cromo-dev-app)
#   DEV_S3_BUCKET       — uploads bucket; docker-compose is uploaded under _deploy/

name: CI + Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect non-doc changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'

  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cromo
          POSTGRES_PASSWORD: localpassword
          POSTGRES_DB: cromo_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cromo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cromo:localpassword@localhost:5432/cromo_dev
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      AUTH_MODE: local
      JWT_SECRET: ci-test-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply Drizzle migrations
        run: pnpm --filter @cromo/backend db:migrate

      - name: Seed catalog
        run: ./scripts/seed-database.sh --remote

      - name: Unit + integration tests
        run: pnpm test

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gitleaks needs full history to scan past commits

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (npm CVEs)
        run: pnpm audit --audit-level=high

      - name: Trivy filesystem scan (deps + Dockerfile misconfig + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: node_modules

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build images (PR smoke-test, no push)
    needs: [test, security, changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'

    steps:
      # fetch-depth: 0 + fetch-tags so `git describe` sees the full tag history.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute APP_VERSION
        id: version
        run: echo "value=$(./scripts/app-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile.cloud
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile.cloud
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://dev.cromotrade.ca
            NEXT_PUBLIC_ENV=ci
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.value }}

  deploy-dev:
    name: Build, push, deploy to dev
    needs: [test, security, changes]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    environment: dev

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ca-central-1
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # fetch-depth: 0 + fetch-tags so `git describe` sees the full tag history.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute APP_VERSION
        id: version
        run: echo "value=$(./scripts/app-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile.cloud
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/cromo-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.ECR_REGISTRY }}/cromo-backend:dev-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile.cloud
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/cromo-frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.ECR_REGISTRY }}/cromo-frontend:dev-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://dev.cromotrade.ca
            NEXT_PUBLIC_ENV=dev
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.value }}

      - name: Upload docker-compose.prod.yml to S3
        run: |
          aws s3 cp infrastructure/docker/docker-compose.prod.yml \
            "s3://${{ secrets.DEV_S3_BUCKET }}/_deploy/docker-compose.prod.yml"

      - name: Trigger rolling redeploy via SSM
        run: |
          # If the business-hours schedule scaled the ASG to 0, bring it up
          # for the deploy. The schedule will scale it back down at the next
          # stop time automatically.
          CURRENT=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ secrets.DEV_ASG_NAME }}" \
            --query "AutoScalingGroups[0].DesiredCapacity" \
            --output text)
          if [ "$CURRENT" = "0" ]; then
            echo "ASG is at 0 — scaling up to 1 for deploy..."
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "${{ secrets.DEV_ASG_NAME }}" \
              --min-size 1 --max-size 1 --desired-capacity 1
          fi

          # Wait up to 5 min for an InService instance.
          echo "Waiting for an InService instance..."
          INSTANCE_IDS=""
          for i in $(seq 1 30); do
            INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "${{ secrets.DEV_ASG_NAME }}" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
              --output text)
            [ -n "$INSTANCE_IDS" ] && break
            echo "  attempt $i/30 — no InService instance yet, retrying in 10s..."
            sleep 10
          done

          if [ -z "$INSTANCE_IDS" ]; then
            echo "Timed out waiting for InService instance in ${{ secrets.DEV_ASG_NAME }}" >&2
            exit 1
          fi

          # Wait up to 3 min for the SSM agent to register on the instance.
          # EC2 health checks pass before the SSM agent connects, so there is
          # a gap between InService and SendCommand being accepted.
          echo "Waiting for SSM agent to register on $INSTANCE_IDS..."
          for i in $(seq 1 18); do
            ONLINE=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_IDS" \
              --query "length(InstanceInformationList)" \
              --output text 2>/dev/null || echo "0")
            [ "$ONLINE" != "0" ] && break
            echo "  attempt $i/18 — SSM not registered yet, retrying in 10s..."
            sleep 10
          done

          aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ env.IMAGE_TAG }}" \
            --parameters "commands=[
              \"set -euxo pipefail\",
              \"export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}\",
              \"export IMAGE_TAG=${{ env.IMAGE_TAG }}\",
              \"export CROMO_ENV=dev\",
              \"cd /opt/cromo\",
              \"aws s3 cp s3://${{ secrets.DEV_S3_BUCKET }}/_deploy/docker-compose.prod.yml docker-compose.yml\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}\",
              \"docker compose pull\",
              \"docker compose up -d\",
              \"docker image prune -af\"
            ]"
